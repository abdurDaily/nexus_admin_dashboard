<!doctype html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Users | Nexus Admin</title>
  <script>try{document.documentElement.dataset.bsTheme=localStorage.getItem('nexus-theme')||'light'}catch(e){}</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
  <link href="assets/css/app.css" rel="stylesheet">
</head>
<body data-title="Users">
<main class="content">
  <div class="row g-4 mb-4" id="stats"></div>
  <div class="card" id="userTable"></div>
</main>

<div class="offcanvas offcanvas-end" tabindex="-1" id="userPanel" aria-labelledby="userPanelTitle">
  <div class="offcanvas-header border-bottom">
    <h5 class="offcanvas-title" id="userPanelTitle">Add User</h5>
    <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
  </div>
  <div class="offcanvas-body">
    <form id="userForm" novalidate>
      <div class="mb-3"><label class="form-label" for="uName">Full name</label><input class="form-control" id="uName" required><div class="invalid-feedback">Name is required.</div></div>
      <div class="mb-3"><label class="form-label" for="uEmail">Email</label><input type="email" class="form-control" id="uEmail" required><div class="invalid-feedback">Enter a valid, unused email.</div></div>
      <div class="mb-3"><label class="form-label" for="uPhone">Contact</label><input class="form-control" id="uPhone" placeholder="+1 (555) 000-0000"></div>
      <div class="mb-3"><label class="form-label" for="uCountry">Country</label><select class="form-select" id="uCountry"></select></div>
      <div class="mb-3"><label class="form-label" for="uRole">Role</label><select class="form-select" id="uRole"></select></div>
      <div class="mb-4"><label class="form-label" for="uPlan">Plan</label><select class="form-select" id="uPlan"></select></div>
      <button class="btn btn-primary me-2" type="submit">Submit</button>
      <button class="btn btn-label-secondary" type="button" data-bs-dismiss="offcanvas">Cancel</button>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/table.js"></script>
<script src="assets/js/layout.js"></script>
<script>
(() => {
  let users = Store.get('users');
  const { roles, plans, countries } = SEED.lookups;
  const $ = id => document.getElementById(id);
  const panel = new bootstrap.Offcanvas('#userPanel');
  const form = $('userForm');
  const ROLE_ICONS = { Admin: 'bx-desktop text-danger', Editor: 'bx-edit text-info', Author: 'bx-pencil text-warning', Maintainer: 'bx-pie-chart-alt text-success', Subscriber: 'bx-user text-primary' };
  const opts = list => list.map(x => `<option>${x}</option>`).join('');
  $('uCountry').innerHTML = opts(countries);
  $('uRole').innerHTML = opts(roles);
  $('uPlan').innerHTML = opts(plans);

  function renderStats() {
    const stats = [
      ['Total Users', users.length, 'bx-group', 'primary'],
      ['Active Users', users.filter(u => u.status === 'Active').length, 'bx-user-check', 'success'],
      ['Pending Users', users.filter(u => u.status === 'Pending').length, 'bx-user-voice', 'warning'],
      ['Inactive Users', users.filter(u => u.status === 'Inactive').length, 'bx-user-x', 'danger']
    ];
    $('stats').innerHTML = stats.map(([label, v, icon, color]) => `
      <div class="col-sm-6 col-xl-3"><div class="card h-100"><div class="card-body d-flex justify-content-between align-items-center">
        <div><p class="mb-1">${label}</p><h4 class="mb-0">${v}</h4></div>
        <span class="stat-icon stat-icon-lg bg-label-${color}"><i class="bx ${icon}"></i></span>
      </div></div></div>`).join('');
  }

  const table = DataTable({
    el: $('userTable'),
    getData: () => users,
    searchKeys: ['name', 'email', 'username', 'role', 'plan'],
    filters: [
      { key: 'role', label: 'Role', options: roles },
      { key: 'plan', label: 'Plan', options: plans },
      { key: 'status', label: 'Status', options: ['Active', 'Pending', 'Inactive'] }
    ],
    toolbar: '<button class="btn btn-primary" data-action="add"><i class="bx bx-plus me-1"></i>Add New User</button>',
    columns: [
      { label: 'User', key: 'name', render: u => `<div class="d-flex align-items-center gap-2">${U.avatar(u.name)}<div><a href="user-view-account.html?id=${u.id}" class="text-heading fw-medium d-block">${U.esc(u.name)}</a><small class="text-muted">${U.esc(u.email)}</small></div></div>` },
      { label: 'Role', key: 'role', render: u => `<span class="text-nowrap text-heading"><i class="bx ${ROLE_ICONS[u.role]} me-1 align-middle fs-5"></i>${u.role}</span>` },
      { label: 'Plan', key: 'plan' },
      { label: 'Billing', render: () => 'Auto Debit' },
      { label: 'Status', key: 'status', render: u => U.badge(u.status) },
      { label: 'Actions', render: u => `<div class="d-flex gap-1"><a class="btn btn-icon btn-sm btn-text" href="user-view-account.html?id=${u.id}" aria-label="View"><i class="bx bx-show"></i></a><button class="btn btn-icon btn-sm btn-text" data-action="delete" aria-label="Delete"><i class="bx bx-trash"></i></button></div>` }
    ]
  });

  $('userTable').addEventListener('click', async e => {
    const btn = e.target.closest('[data-action]');
    if (!btn) return;
    if (btn.dataset.action === 'add') { form.reset(); form.classList.remove('was-validated'); panel.show(); return; }
    const user = users.find(u => u.id === Number(btn.closest('tr').dataset.id));
    if (user.id === 1) { U.toast("You can't delete your own account", 'warning'); return; }
    if (!(await U.confirm(`${user.name} will be permanently deleted.`))) return;
    users = users.filter(u => u !== user);
    Store.set('users', users);
    table.refresh();
    renderStats();
    U.toast('User deleted');
  });

  form.addEventListener('submit', e => {
    e.preventDefault();
    const email = $('uEmail').value.trim().toLowerCase();
    $('uEmail').setCustomValidity(users.some(u => u.email.toLowerCase() === email) ? 'duplicate' : '');
    if (!form.checkValidity()) { form.classList.add('was-validated'); return; }
    const name = $('uName').value.trim();
    users.unshift({
      id: Store.nextId(users), name, email, username: name.split(' ')[0].toLowerCase(),
      role: $('uRole').value, plan: $('uPlan').value, status: 'Pending', country: $('uCountry').value, phone: $('uPhone').value.trim(), joined: U.today()
    });
    Store.set('users', users);
    table.refresh();
    renderStats();
    panel.hide();
    U.toast('User added');
  });

  renderStats();
})();
</script>
</body>
</html>
