<!doctype html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Invoice Preview | Nexus Admin</title>
  <script>try{document.documentElement.dataset.bsTheme=localStorage.getItem('nexus-theme')||'light'}catch(e){}</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
  <link href="assets/css/app.css" rel="stylesheet">
</head>
<body data-title="Invoice Preview">
<main class="content">
  <div class="row g-4">
    <div class="col-xl-9">
      <div class="card" id="invoice"></div>
    </div>
    <div class="col-xl-3 no-print">
      <div class="card"><div class="card-body d-grid gap-2">
        <button type="button" class="btn btn-primary" id="markPaid"><i class="bx bx-check me-1"></i>Mark as Paid</button>
        <button type="button" class="btn btn-label-secondary" onclick="window.print()"><i class="bx bx-printer me-1"></i>Print / Save PDF</button>
        <a class="btn btn-label-secondary" id="editLink"><i class="bx bx-edit me-1"></i>Edit</a>
        <button type="button" class="btn btn-label-danger" id="deleteInvoice"><i class="bx bx-trash me-1"></i>Delete</button>
        <a href="invoice-list.html" class="btn btn-text mt-2"><i class="bx bx-arrow-back me-1"></i>All invoices</a>
      </div></div>
    </div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/layout.js"></script>
<script>
(() => {
  let invoices = Store.get('invoices');
  const inv = invoices.find(i => i.id === Number(U.param('id'))) || invoices[0];
  const el = document.getElementById('invoice');
  if (!inv) { el.innerHTML = '<div class="card-body">No invoices yet. <a href="invoice-add.html">Create one</a>.</div>'; return; }
  const esc = U.esc;

  function render() {
    const t = U.invoiceTotals(inv);
    document.getElementById('markPaid').disabled = inv.status === 'Paid';
    el.innerHTML = `
      <div class="card-body border-bottom d-flex flex-wrap justify-content-between gap-4">
        <div>
          <div class="invoice-brand mb-3"><i class="bx bxs-layer fs-2 text-primary"></i><span class="fs-4 fw-bold">Nexus</span></div>
          <p class="mb-1">Office 149, 450 South Brand Brooklyn</p>
          <p class="mb-1">San Diego County, CA 91905, USA</p>
          <p class="mb-0">+1 (123) 456 7891</p>
        </div>
        <div class="text-sm-end">
          <h5 class="mb-2">Invoice #${inv.id} ${U.badge(inv.status)}</h5>
          <p class="mb-1">Date issued: <span class="text-heading">${U.date(inv.issued)}</span></p>
          <p class="mb-0">Date due: <span class="text-heading">${U.date(inv.due)}</span></p>
        </div>
      </div>
      <div class="card-body border-bottom row g-4 mx-0 px-0">
        <div class="col-sm-6 px-4">
          <h6 class="mb-2">Invoice to:</h6>
          <p class="mb-1 text-heading">${esc(inv.client)}</p>
          <p class="mb-1">${esc(inv.company)}</p>
          <p class="mb-1">${esc(inv.address || '')}</p>
          <p class="mb-0">${esc(inv.email)}</p>
        </div>
        <div class="col-sm-6 px-4">
          <h6 class="mb-2">Bill to:</h6>
          <table class="table table-borderless table-sm w-auto mb-0"><tbody>
            <tr><td class="ps-0 py-1">Total due:</td><td class="py-1 fw-medium text-heading">${U.money(t.total)}</td></tr>
            <tr><td class="ps-0 py-1">Bank name:</td><td class="py-1">American Bank</td></tr>
            <tr><td class="ps-0 py-1">Country:</td><td class="py-1">United States</td></tr>
            <tr><td class="ps-0 py-1">IBAN:</td><td class="py-1">ETD95476213874685</td></tr>
          </tbody></table>
        </div>
      </div>
      <div class="table-responsive">
        <table class="table align-middle">
          <thead><tr><th>Item</th><th>Cost</th><th>Qty</th><th class="text-end">Price</th></tr></thead>
          <tbody>${inv.items.map(it => `<tr><td class="text-heading">${esc(it.desc)}</td><td>${U.money(it.price)}</td><td>${it.qty}</td><td class="text-end">${U.money(it.qty * it.price)}</td></tr>`).join('')}</tbody>
        </table>
      </div>
      <div class="card-body d-flex flex-wrap justify-content-between gap-4">
        <p class="mb-0" style="max-width:24rem"><span class="fw-medium text-heading">Salesperson:</span> ${esc(Store.get('profile').firstName)} ${esc(Store.get('profile').lastName)}<br>${esc(inv.notes || '')}</p>
        <dl class="row mb-0" style="min-width:15rem">
          <dt class="col-6 fw-normal">Subtotal:</dt><dd class="col-6 text-end mb-1 text-heading">${U.money(t.subtotal)}</dd>
          <dt class="col-6 fw-normal">Discount (${inv.discount || 0}%):</dt><dd class="col-6 text-end mb-1 text-heading">-${U.money(t.discount)}</dd>
          <dt class="col-6 fw-normal">Tax (${inv.tax || 0}%):</dt><dd class="col-6 text-end mb-1 text-heading">${U.money(t.tax)}</dd>
          <dt class="col-6 text-heading border-top pt-2">Total:</dt><dd class="col-6 text-end mb-0 fw-semibold text-heading border-top pt-2">${U.money(t.total)}</dd>
        </dl>
      </div>`;
  }

  document.getElementById('editLink').href = `invoice-add.html?id=${inv.id}`;
  document.getElementById('markPaid').addEventListener('click', () => {
    inv.status = 'Paid';
    Store.set('invoices', invoices);
    render();
    U.toast(`Invoice #${inv.id} marked as paid`);
  });
  document.getElementById('deleteInvoice').addEventListener('click', async () => {
    if (!(await U.confirm(`Invoice #${inv.id} will be permanently deleted.`))) return;
    invoices = invoices.filter(i => i !== inv);
    Store.set('invoices', invoices);
    U.flash('Invoice deleted');
    location.href = 'invoice-list.html';
  });

  render();
})();
</script>
</body>
</html>
