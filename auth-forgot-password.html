<!doctype html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Forgot Password | Nexus Admin</title>
  <script>try{document.documentElement.dataset.bsTheme=localStorage.getItem('nexus-theme')||'light'}catch(e){}</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
  <link href="assets/css/app.css" rel="stylesheet">
</head>
<body>
  <main class="auth-wrapper">
    <div class="card auth-card"><div class="card-body p-4 p-sm-5">
      <a href="index.html" class="auth-brand"><i class="bx bxs-layer fs-1 text-primary"></i><span class="fs-3 fw-bold">Nexus</span></a>
      <h4 class="mb-1">Forgot Password? 🔒</h4>
      <p class="mb-4">Enter your email and we'll send you instructions to reset your password</p>
      <div class="alert alert-success bg-label-success d-none" id="sentAlert" role="status"></div>
      <form id="forgotForm" novalidate>
        <div class="mb-4"><label class="form-label" for="forgotEmail">Email</label><input type="email" class="form-control" id="forgotEmail" placeholder="Enter your email" autocomplete="email" required autofocus><div class="invalid-feedback">Enter a valid email.</div></div>
        <button class="btn btn-primary w-100" type="submit">Send Reset Link</button>
      </form>
      <div class="text-center mt-4"><a href="auth-login.html"><i class="bx bx-chevron-left"></i>Back to login</a></div>
    </div></div>
  </main>
<script>
(() => {
  const form = document.getElementById('forgotForm');
  // Demo only: no email is actually sent.
  form.addEventListener('submit', e => {
    e.preventDefault();
    if (!form.checkValidity()) { form.classList.add('was-validated'); return; }
    const alert = document.getElementById('sentAlert');
    alert.textContent = `If an account exists for ${document.getElementById('forgotEmail').value}, a reset link has been sent.`;
    alert.classList.remove('d-none');
    form.reset();
    form.classList.remove('was-validated');
  });
})();
</script>
</body>
</html>
