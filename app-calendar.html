<!doctype html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calendar | Nexus Admin</title>
  <script>try{document.documentElement.dataset.bsTheme=localStorage.getItem('nexus-theme')||'light'}catch(e){}</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
  <link href="assets/css/app.css" rel="stylesheet">
</head>
<body>
<main class="content">
  <div class="card app-calendar">
    <aside class="calendar-sidebar">
      <button type="button" class="btn btn-primary w-100 mb-4" id="addEventBtn"><i class="bx bx-plus me-1"></i>Add Event</button>
      <h6 class="text-muted text-uppercase small mb-3">Event Filters</h6>
      <div class="form-check mb-3">
        <input class="form-check-input" type="checkbox" id="filterAll" checked>
        <label class="form-check-label" for="filterAll">View All</label>
      </div>
      <div id="calendarFilters"></div>
    </aside>
    <div class="calendar-main"><div id="calendar"></div></div>
  </div>
</main>

<div class="offcanvas offcanvas-end" tabindex="-1" id="eventPanel" aria-labelledby="eventPanelTitle">
  <div class="offcanvas-header border-bottom">
    <h5 class="offcanvas-title" id="eventPanelTitle">Add Event</h5>
    <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
  </div>
  <div class="offcanvas-body">
    <form id="eventForm" novalidate>
      <div class="mb-3"><label class="form-label" for="eTitle">Title</label><input class="form-control" id="eTitle" required><div class="invalid-feedback">Title is required.</div></div>
      <div class="mb-3"><label class="form-label" for="eCalendar">Label</label><select class="form-select" id="eCalendar"></select></div>
      <div class="form-check form-switch mb-3"><input class="form-check-input" type="checkbox" id="eAllDay" checked><label class="form-check-label" for="eAllDay">All day</label></div>
      <div class="mb-3"><label class="form-label" for="eStart">Start</label><input class="form-control" id="eStart" type="date" required><div class="invalid-feedback">Start is required.</div></div>
      <div class="mb-4"><label class="form-label" for="eEnd">End</label><input class="form-control" id="eEnd" type="date"><div class="invalid-feedback">End must be after start.</div></div>
      <div class="d-flex gap-2">
        <button type="submit" class="btn btn-primary" id="eSubmit">Add</button>
        <button type="button" class="btn btn-label-danger d-none" id="eDelete">Delete</button>
        <button type="button" class="btn btn-label-secondary" data-bs-dismiss="offcanvas">Cancel</button>
      </div>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/layout.js"></script>
<script>
(() => {
  const CALENDARS = { Business: 'primary', Personal: 'danger', Family: 'warning', Holiday: 'success', ETC: 'info' };
  let events = Store.get('events');
  const save = () => Store.set('events', events);
  const panel = new bootstrap.Offcanvas('#eventPanel');
  const form = document.getElementById('eventForm');
  const fields = {
    title: document.getElementById('eTitle'), calendar: document.getElementById('eCalendar'), allDay: document.getElementById('eAllDay'),
    start: document.getElementById('eStart'), end: document.getElementById('eEnd')
  };
  let editingId = null;
  const active = new Set(Object.keys(CALENDARS));

  fields.calendar.innerHTML = Object.keys(CALENDARS).map(c => `<option>${c}</option>`).join('');
  document.getElementById('calendarFilters').innerHTML = Object.entries(CALENDARS).map(([name, color]) => `
    <div class="form-check mb-3">
      <input class="form-check-input cal-filter" type="checkbox" id="f-${name}" value="${name}" checked style="--bs-form-check-bg:transparent;border-color:var(--${color})">
      <label class="form-check-label" for="f-${name}"><span class="badge bg-label-${color}">${name}</span></label>
    </div>`).join('');

  const toFc = e => ({ id: String(e.id), title: e.title, start: e.start, end: e.end || undefined, allDay: !e.start.includes('T'), classNames: [`ev-${e.calendar}`], extendedProps: { calendar: e.calendar } });

  const calendar = new FullCalendar.Calendar(document.getElementById('calendar'), {
    initialView: 'dayGridMonth',
    headerToolbar: { start: 'prev,next today title', end: 'dayGridMonth,timeGridWeek,timeGridDay,listMonth' },
    height: 'auto',
    editable: true,
    dayMaxEvents: 3,
    eventDisplay: 'block',
    events: (info, success) => success(events.filter(e => active.has(e.calendar)).map(toFc)),
    dateClick: info => openPanel({ start: info.dateStr.slice(0, 10) }),
    eventClick: info => openPanel(events.find(e => String(e.id) === info.event.id)),
    eventDrop: info => updateFromFc(info.event),
    eventResize: info => updateFromFc(info.event)
  });
  calendar.render();
  document.addEventListener('themechange', () => calendar.render());

  // Persist drag/resize (keep date-only for all-day events)
  function updateFromFc(fcEvent) {
    const ev = events.find(e => String(e.id) === fcEvent.id);
    const cut = fcEvent.allDay ? 10 : 16;
    ev.start = fcEvent.startStr.slice(0, cut);
    ev.end = fcEvent.end ? fcEvent.endStr.slice(0, cut) : undefined;
    save();
    U.toast('Event updated');
  }

  function openPanel(ev = {}) {
    editingId = ev.id ?? null;
    form.classList.remove('was-validated');
    fields.end.setCustomValidity('');
    document.getElementById('eventPanelTitle').textContent = editingId ? 'Edit Event' : 'Add Event';
    document.getElementById('eSubmit').textContent = editingId ? 'Update' : 'Add';
    document.getElementById('eDelete').classList.toggle('d-none', !editingId);
    fields.title.value = ev.title || '';
    fields.calendar.value = ev.calendar || 'Business';
    const allDay = !ev.start || !ev.start.includes('T');
    fields.allDay.checked = allDay;
    setInputType(allDay);
    fields.start.value = ev.start ? (allDay ? ev.start.slice(0, 10) : ev.start.slice(0, 16)) : U.today();
    fields.end.value = ev.end ? (allDay ? ev.end.slice(0, 10) : ev.end.slice(0, 16)) : '';
    panel.show();
  }

  function setInputType(allDay) {
    ['start', 'end'].forEach(k => {
      const v = fields[k].value;
      fields[k].type = allDay ? 'date' : 'datetime-local';
      fields[k].value = v ? (allDay ? v.slice(0, 10) : (v.length === 10 ? `${v}T09:00` : v)) : '';
    });
  }
  fields.allDay.addEventListener('change', () => setInputType(fields.allDay.checked));

  form.addEventListener('submit', e => {
    e.preventDefault();
    fields.end.setCustomValidity(fields.end.value && fields.end.value < fields.start.value ? 'invalid' : '');
    if (!form.checkValidity()) { form.classList.add('was-validated'); return; }
    const data = { title: fields.title.value.trim(), calendar: fields.calendar.value, start: fields.start.value, end: fields.end.value || undefined };
    if (editingId) Object.assign(events.find(ev => ev.id === editingId), data);
    else events.push({ id: Store.nextId(events), ...data });
    save();
    calendar.refetchEvents();
    panel.hide();
    U.toast(editingId ? 'Event updated' : 'Event added');
  });

  document.getElementById('eDelete').addEventListener('click', () => {
    events = events.filter(ev => ev.id !== editingId);
    save();
    calendar.refetchEvents();
    panel.hide();
    U.toast('Event deleted');
  });

  document.getElementById('addEventBtn').addEventListener('click', () => openPanel());

  // Filters
  const all = document.getElementById('filterAll');
  const boxes = [...document.querySelectorAll('.cal-filter')];
  const applyFilters = () => {
    active.clear();
    boxes.filter(b => b.checked).forEach(b => active.add(b.value));
    all.checked = active.size === boxes.length;
    calendar.refetchEvents();
  };
  boxes.forEach(b => b.addEventListener('change', applyFilters));
  all.addEventListener('change', () => { boxes.forEach(b => { b.checked = all.checked; }); applyFilters(); });
})();
</script>
</body>
</html>
