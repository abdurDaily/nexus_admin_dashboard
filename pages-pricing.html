<!doctype html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pricing | Nexus Admin</title>
  <script>try{document.documentElement.dataset.bsTheme=localStorage.getItem('nexus-theme')||'light'}catch(e){}</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
  <link href="assets/css/app.css" rel="stylesheet">
</head>
<body>
<main class="content">
  <div class="card">
    <div class="card-body p-4 p-md-5">
      <div class="text-center mb-5">
        <h3 class="mb-2">Pricing Plans</h3>
        <p class="mb-4">All plans include 40+ advanced tools and features to boost your product.<br class="d-none d-md-block">Choose the best plan to fit your needs.</p>
        <div class="d-inline-flex align-items-center gap-3">
          <label class="form-check-label" for="billingToggle">Monthly</label>
          <div class="form-check form-switch mb-0"><input class="form-check-input" type="checkbox" role="switch" id="billingToggle" checked style="width:2.6rem;height:1.3rem"></div>
          <label class="form-check-label" for="billingToggle">Annually <span class="badge bg-label-primary ms-1">Save up to 10%</span></label>
        </div>
      </div>
      <div class="row g-4 justify-content-center" id="plans"></div>
    </div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/layout.js"></script>
<script>
(() => {
  const PLANS = [
    { name: 'Basic', icon: 'bx-rocket', text: 'A simple start for everyone', monthly: 0, features: ['100 responses a month', 'Unlimited forms and surveys', 'Unlimited fields', 'Basic form creation tools', 'Up to 2 subdomains'] },
    { name: 'Standard', icon: 'bx-diamond', text: 'For small to medium businesses', monthly: 49, popular: true, features: ['Unlimited responses', 'Unlimited forms and surveys', 'Instagram profile page', 'Google Docs integration', 'Custom “Thank you” page'] },
    { name: 'Enterprise', icon: 'bx-buildings', text: 'Solution for big organizations', monthly: 99, features: ['PayPal payments', 'Logic Jumps', 'File upload with 5GB storage', 'Custom domain support', 'Stripe integration'] }
  ];
  const toggle = document.getElementById('billingToggle');
  let current = Store.pref('plan') || 'Basic';

  function render() {
    const annual = toggle.checked;
    document.getElementById('plans').innerHTML = PLANS.map(p => {
      const price = annual ? Math.round(p.monthly * 0.9) : p.monthly;
      const isCurrent = p.name === current;
      return `<div class="col-lg-4 col-md-6">
        <div class="card pricing-card h-100 border ${p.popular ? 'popular' : ''}">
          <div class="card-body d-flex flex-column">
            ${p.popular ? '<span class="badge bg-label-primary align-self-end">Popular</span>' : '<span class="badge invisible align-self-end">-</span>'}
            <div class="text-center my-3"><i class="bx ${p.icon} text-primary" style="font-size:4rem"></i></div>
            <h4 class="text-center mb-1">${p.name}</h4>
            <p class="text-center">${p.text}</p>
            <div class="text-center mb-1"><sup class="fs-6 text-primary">$</sup><span class="pricing-price">${price}</span><sub class="text-muted">/month</sub></div>
            <p class="text-center small text-muted mb-4">${annual && p.monthly ? `USD ${price * 12}/year` : '&nbsp;'}</p>
            <ul class="list-unstyled pricing-features mb-4 flex-grow-1">
              ${p.features.map(f => `<li><i class="bx bx-check-circle text-primary"></i>${f}</li>`).join('')}
            </ul>
            <button type="button" class="btn ${isCurrent ? 'btn-label-success' : p.popular ? 'btn-primary' : 'btn-label-primary'} w-100" data-plan="${p.name}" ${isCurrent ? 'disabled' : ''}>${isCurrent ? 'Your Current Plan' : 'Upgrade'}</button>
          </div>
        </div>
      </div>`;
    }).join('');
  }

  toggle.addEventListener('change', render);
  document.getElementById('plans').addEventListener('click', e => {
    const btn = e.target.closest('[data-plan]');
    if (!btn) return;
    current = btn.dataset.plan;
    Store.pref('plan', current);
    render();
    U.toast(`You're now on the ${current} plan (${toggle.checked ? 'annual' : 'monthly'} billing)`);
  });
  render();
})();
</script>
</body>
</html>
