<!doctype html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Invoice List | Nexus Admin</title>
  <script>try{document.documentElement.dataset.bsTheme=localStorage.getItem('nexus-theme')||'light'}catch(e){}</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
  <link href="assets/css/app.css" rel="stylesheet">
</head>
<body data-title="Invoices">
<main class="content">
  <div class="row g-4 mb-4" id="stats"></div>
  <div class="card" id="invoiceTable"></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/table.js"></script>
<script src="assets/js/layout.js"></script>
<script>
(() => {
  let invoices = Store.get('invoices');
  const total = inv => U.invoiceTotals(inv).total;

  function renderStats() {
    const sumBy = s => invoices.filter(i => i.status === s).reduce((t, i) => t + total(i), 0);
    const stats = [
      ['Clients', new Set(invoices.map(i => i.email)).size, 'bx-user', 'primary'],
      ['Invoices', invoices.length, 'bx-file', 'info'],
      ['Paid', U.money(sumBy('Paid')), 'bx-check-double', 'success'],
      ['Past Due', U.money(sumBy('Past Due')), 'bx-error-circle', 'danger']
    ];
    document.getElementById('stats').innerHTML = stats.map(([label, v, icon, color]) => `
      <div class="col-sm-6 col-xl-3"><div class="card h-100"><div class="card-body d-flex justify-content-between align-items-center">
        <div><h4 class="mb-0">${v}</h4><p class="mb-0">${label}</p></div>
        <span class="stat-icon stat-icon-lg bg-label-${color}"><i class="bx ${icon}"></i></span>
      </div></div></div>`).join('');
  }

  const table = DataTable({
    el: document.getElementById('invoiceTable'),
    getData: () => invoices,
    searchKeys: ['id', 'client', 'email', 'company'],
    filters: [{ key: 'status', label: 'Invoice Status', options: ['Paid', 'Sent', 'Draft', 'Past Due', 'Partial Payment'] }],
    toolbar: '<a href="invoice-add.html" class="btn btn-primary"><i class="bx bx-plus me-1"></i>Create Invoice</a>',
    columns: [
      { label: '#', key: 'id', render: i => `<a href="invoice-preview.html?id=${i.id}" class="fw-medium">#${i.id}</a>` },
      { label: 'Client', key: 'client', render: i => `<div class="d-flex align-items-center gap-2">${U.avatar(i.client, 'avatar-sm')}<div><span class="text-heading d-block text-nowrap">${U.esc(i.client)}</span><small class="text-muted">${U.esc(i.company)}</small></div></div>` },
      { label: 'Total', sortValue: total, render: i => `<span class="fw-medium text-heading">${U.money(total(i))}</span>` },
      { label: 'Issued', key: 'issued', render: i => `<span class="text-nowrap">${U.date(i.issued)}</span>` },
      { label: 'Due', key: 'due', render: i => `<span class="text-nowrap">${U.date(i.due)}</span>` },
      { label: 'Status', key: 'status', render: i => U.badge(i.status) },
      { label: 'Actions', render: i => `<div class="d-flex gap-1">
        <a class="btn btn-icon btn-sm btn-text" href="invoice-preview.html?id=${i.id}" aria-label="Preview"><i class="bx bx-show"></i></a>
        <a class="btn btn-icon btn-sm btn-text" href="invoice-add.html?id=${i.id}" aria-label="Edit"><i class="bx bx-edit"></i></a>
        <button class="btn btn-icon btn-sm btn-text" data-action="delete" aria-label="Delete"><i class="bx bx-trash"></i></button></div>` }
    ]
  });

  document.getElementById('invoiceTable').addEventListener('click', async e => {
    const btn = e.target.closest('[data-action="delete"]');
    if (!btn) return;
    const id = Number(btn.closest('tr').dataset.id);
    if (!(await U.confirm(`Invoice #${id} will be permanently deleted.`))) return;
    invoices = invoices.filter(i => i.id !== id);
    Store.set('invoices', invoices);
    table.refresh();
    renderStats();
    U.toast('Invoice deleted');
  });

  renderStats();
})();
</script>
</body>
</html>
