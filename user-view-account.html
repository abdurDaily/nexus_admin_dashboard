<!doctype html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>User Account | Nexus Admin</title>
  <script>try{document.documentElement.dataset.bsTheme=localStorage.getItem('nexus-theme')||'light'}catch(e){}</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
  <link href="assets/css/app.css" rel="stylesheet">
</head>
<body>
<main class="content">
  <div class="row g-4">
    <div class="col-xl-4 col-lg-5"><div class="card" id="userCard"></div></div>
    <div class="col-xl-8 col-lg-7">
      <ul class="nav nav-pills mb-4">
        <li class="nav-item"><a class="nav-link active" aria-current="page" data-user-tab="user-view-account.html"><i class="bx bx-user"></i>Account</a></li>
        <li class="nav-item"><a class="nav-link" data-user-tab="user-view-security.html"><i class="bx bx-lock-alt"></i>Security</a></li>
      </ul>

      <div class="card mb-4">
        <div class="card-header"><h5 class="card-title">Project List</h5></div>
        <div class="table-responsive">
          <table class="table align-middle"><thead><tr><th>Project</th><th>Leader</th><th>Team</th><th>Progress</th></tr></thead><tbody id="projects"></tbody></table>
        </div>
      </div>

      <div class="card">
        <div class="card-header"><h5 class="card-title">User Activity Timeline</h5></div>
        <div class="card-body"><ul class="timeline" id="activity"></ul></div>
      </div>
    </div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/layout.js"></script>
<script src="assets/js/user-view.js"></script>
<script>
(() => {
  const { user } = UserView;
  const team = Store.get('users').filter(u => u.id !== user.id);
  const PROJECTS = [['BGC eCommerce App', 'React Project'], ['Falcon Logo Design', 'Figma Project'], ['Dashboard Design', 'Vuejs Project'], ['Foodista Mobile App', 'Xamarin Project'], ['Dojo React Project', 'Python Project']];
  document.getElementById('projects').innerHTML = PROJECTS.map(([name, type], i) => {
    const progress = (user.id * 17 + i * 23) % 100;
    const members = team.slice((user.id + i * 3) % 30, (user.id + i * 3) % 30 + 3);
    return `<tr>
      <td><div class="d-flex align-items-center gap-2"><span class="avatar avatar-sm avatar-rounded bg-label-${['primary', 'info', 'warning', 'success', 'danger'][i]}"><i class="bx bx-folder"></i></span><div><span class="text-heading fw-medium d-block text-nowrap">${name}</span><small class="text-muted">${type}</small></div></div></td>
      <td class="text-nowrap">${U.esc(members[0]?.name || user.name)}</td>
      <td><div class="avatar-group">${members.map(m => U.avatar(m.name, 'avatar-sm')).join('')}</div></td>
      <td style="min-width:9rem"><small class="d-block mb-1">${progress}%</small><div class="progress" role="progressbar" aria-label="Progress" aria-valuenow="${progress}" aria-valuemin="0" aria-valuemax="100"><div class="progress-bar" style="width:${progress}%"></div></div></td>
    </tr>`;
  }).join('');

  const items = [
    ['primary', '12 Invoices have been paid', 'Invoices have been paid to the company', '12 min ago'],
    ['success', 'Client Meeting', 'Project meeting with John @10:15am', '45 min ago'],
    ['info', 'Create a new project for client', `Assigned to ${U.esc(user.name)}`, '2 days ago'],
    ['warning', 'Updated profile', 'Changed contact and country details', '5 days ago']
  ];
  document.getElementById('activity').innerHTML = items.map(([c, t, d, time]) => `
    <li class="timeline-item"><span class="timeline-point ${c}"></span>
      <div class="d-flex justify-content-between flex-wrap mb-1"><h6 class="mb-0">${t}</h6><small class="text-muted">${time}</small></div>
      <p class="mb-0">${d}</p></li>`).join('');
})();
</script>
</body>
</html>
