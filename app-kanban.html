<!doctype html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kanban | Nexus Admin</title>
  <script>try{document.documentElement.dataset.bsTheme=localStorage.getItem('nexus-theme')||'light'}catch(e){}</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
  <link href="assets/css/app.css" rel="stylesheet">
</head>
<body>
<main class="content">
  <div class="page-actions">
    <div class="input-group" style="max-width:16rem">
      <span class="input-group-text"><i class="bx bx-search"></i></span>
      <input type="search" class="form-control" id="kanbanSearch" placeholder="Filter tasks" aria-label="Filter tasks">
    </div>
  </div>
  <div class="kanban" id="board"></div>
</main>

<div class="offcanvas offcanvas-end" tabindex="-1" id="taskPanel" aria-labelledby="taskPanelTitle">
  <div class="offcanvas-header border-bottom">
    <h5 class="offcanvas-title" id="taskPanelTitle">Edit Task</h5>
    <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
  </div>
  <div class="offcanvas-body">
    <form id="taskForm" novalidate>
      <div class="mb-3"><label class="form-label" for="fTitle">Title</label><input class="form-control" id="fTitle" required><div class="invalid-feedback">Title is required.</div></div>
      <div class="mb-3"><label class="form-label" for="fLabel">Label</label><select class="form-select" id="fLabel"></select></div>
      <div class="mb-3"><label class="form-label" for="fDue">Due date</label><input class="form-control" id="fDue" type="date"></div>
      <div class="mb-3"><label class="form-label" for="fAssigned">Assigned (initials, comma separated)</label><input class="form-control" id="fAssigned" placeholder="AB, CD"></div>
      <div class="mb-4"><label class="form-label" for="fDesc">Description</label><textarea class="form-control" id="fDesc" rows="4"></textarea></div>
      <div class="d-flex gap-2">
        <button class="btn btn-primary" type="submit">Update</button>
        <button class="btn btn-label-danger" type="button" id="deleteTask">Delete</button>
      </div>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/layout.js"></script>
<script src="assets/js/kanban.js"></script>
</body>
</html>
