<!doctype html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login | Nexus Admin</title>
  <script>try{document.documentElement.dataset.bsTheme=localStorage.getItem('nexus-theme')||'light'}catch(e){}</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
  <link href="assets/css/app.css" rel="stylesheet">
</head>
<body>
  <main class="auth-wrapper">
    <div class="card auth-card"><div class="card-body p-4 p-sm-5">
      <a href="index.html" class="auth-brand"><i class="bx bxs-layer fs-1 text-primary"></i><span class="fs-3 fw-bold">Nexus</span></a>
      <h4 class="mb-1">Welcome to Nexus! 👋</h4>
      <p class="mb-4">Please sign in to your account and start the adventure</p>
      <form id="loginForm" novalidate>
        <div class="mb-3"><label class="form-label" for="loginEmail">Email or Username</label><input class="form-control" id="loginEmail" placeholder="Enter your email or username" autocomplete="username" required autofocus><div class="invalid-feedback">Please enter your email or username.</div></div>
        <div class="mb-3">
          <div class="d-flex justify-content-between"><label class="form-label" for="loginPassword">Password</label><a href="auth-forgot-password.html" class="small">Forgot Password?</a></div>
          <div class="input-group has-validation">
            <input type="password" class="form-control" id="loginPassword" placeholder="••••••••" autocomplete="current-password" required minlength="6">
            <button class="btn btn-label-secondary" type="button" id="togglePw" aria-label="Show password"><i class="bx bx-hide"></i></button>
            <div class="invalid-feedback">Password must be at least 6 characters.</div>
          </div>
        </div>
        <div class="form-check mb-4"><input class="form-check-input" type="checkbox" id="remember"><label class="form-check-label" for="remember">Remember Me</label></div>
        <button class="btn btn-primary w-100" type="submit">Login</button>
      </form>
      <p class="text-center mt-4 mb-0">New on our platform? <a href="auth-register.html">Create an account</a></p>
    </div></div>
  </main>
<script>
(() => {
  const form = document.getElementById('loginForm');
  const pw = document.getElementById('loginPassword');
  document.getElementById('togglePw').addEventListener('click', e => {
    const show = pw.type === 'password';
    pw.type = show ? 'text' : 'password';
    e.currentTarget.firstElementChild.className = `bx ${show ? 'bx-show' : 'bx-hide'}`;
    e.currentTarget.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
  });
  // Demo only: there is no backend, so any valid input signs in.
  form.addEventListener('submit', e => {
    e.preventDefault();
    if (!form.checkValidity()) { form.classList.add('was-validated'); return; }
    try { sessionStorage.setItem('nexus-flash', JSON.stringify({ message: 'Welcome back! You are signed in.', type: 'success' })); } catch { /* ignore */ }
    location.href = 'index.html';
  });
})();
</script>
</body>
</html>
