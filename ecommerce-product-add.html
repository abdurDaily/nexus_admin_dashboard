<!doctype html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Add Product | Nexus Admin</title>
  <script>try{document.documentElement.dataset.bsTheme=localStorage.getItem('nexus-theme')||'light'}catch(e){}</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
  <link href="assets/css/app.css" rel="stylesheet">
</head>
<body>
<main class="content">
  <div class="page-actions">
    <a href="ecommerce-product-list.html" class="btn btn-label-secondary">Discard</a>
    <button type="submit" form="productForm" class="btn btn-primary" id="submitBtn">Publish Product</button>
  </div>

  <form id="productForm" class="row g-4" novalidate>
    <div class="col-lg-8">
      <div class="card mb-4">
        <div class="card-header"><h5 class="card-title">Product information</h5></div>
        <div class="card-body">
          <div class="mb-3"><label class="form-label" for="pName">Name</label><input class="form-control" id="pName" placeholder="Product title" required><div class="invalid-feedback">Product name is required.</div></div>
          <div class="row g-3 mb-3">
            <div class="col-md-6"><label class="form-label" for="pSku">SKU</label><input class="form-control" id="pSku" placeholder="12345" required pattern="[A-Za-z0-9-]+"><div class="invalid-feedback">Letters, numbers and dashes only.</div></div>
            <div class="col-md-6"><label class="form-label" for="pBarcode">Barcode</label><input class="form-control" id="pBarcode" placeholder="0123-4567"></div>
          </div>
          <div><label class="form-label" for="pDesc">Description</label><textarea class="form-control" id="pDesc" rows="5" placeholder="Product description"></textarea></div>
        </div>
      </div>
      <div class="card">
        <div class="card-header"><h5 class="card-title">Media</h5></div>
        <div class="card-body">
          <label class="upload-zone d-block" for="pImage">
            <i class="bx bx-cloud-upload fs-1 text-primary d-block mb-2"></i>
            <span class="text-heading d-block">Click to choose an image</span>
            <small class="text-muted" id="pImageName">PNG or JPG, preview only</small>
          </label>
          <input type="file" id="pImage" accept="image/*" class="d-none">
          <img id="pPreview" alt="Selected product image" class="rounded mt-3 d-none" style="max-height:10rem">
        </div>
      </div>
    </div>

    <div class="col-lg-4">
      <div class="card mb-4">
        <div class="card-header"><h5 class="card-title">Pricing</h5></div>
        <div class="card-body">
          <div class="mb-3"><label class="form-label" for="pPrice">Price ($)</label><input type="number" class="form-control" id="pPrice" min="0" step="0.01" required><div class="invalid-feedback">Enter a valid price.</div></div>
          <div class="mb-3"><label class="form-label" for="pQty">Quantity</label><input type="number" class="form-control" id="pQty" min="0" step="1" required><div class="invalid-feedback">Enter a whole number.</div></div>
          <div class="form-check form-switch"><input class="form-check-input" type="checkbox" id="pStock" checked><label class="form-check-label" for="pStock">In stock</label></div>
        </div>
      </div>
      <div class="card">
        <div class="card-header"><h5 class="card-title">Organize</h5></div>
        <div class="card-body">
          <div class="mb-3">
            <div class="d-flex justify-content-between"><label class="form-label" for="pCategory">Category</label><a href="ecommerce-category-list.html" class="small">Manage</a></div>
            <select class="form-select" id="pCategory" required></select>
          </div>
          <div><label class="form-label" for="pStatus">Status</label><select class="form-select" id="pStatus"><option>Published</option><option>Scheduled</option><option>Inactive</option></select></div>
        </div>
      </div>
    </div>
  </form>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/layout.js"></script>
<script>
(() => {
  const products = Store.get('products');
  const categories = Store.get('categories');
  const id = Number(U.param('id'));
  const existing = products.find(p => p.id === id);
  const $ = sel => document.getElementById(sel);

  $('pCategory').innerHTML = categories.map(c => `<option>${U.esc(c.name)}</option>`).join('');

  if (existing) {
    document.querySelector('.page-header h4').textContent = 'Edit Product';
    document.title = 'Edit Product | Nexus Admin';
    $('submitBtn').textContent = 'Save Changes';
    $('pName').value = existing.name;
    $('pSku').value = existing.sku;
    $('pDesc').value = existing.description || '';
    $('pPrice').value = existing.price;
    $('pQty').value = existing.qty;
    $('pStock').checked = existing.inStock;
    $('pCategory').value = existing.category;
    $('pStatus').value = existing.status;
  }

  $('pImage').addEventListener('change', e => {
    const file = e.target.files[0];
    if (!file) return;
    $('pImageName').textContent = file.name;
    const reader = new FileReader();
    reader.onload = () => { $('pPreview').src = reader.result; $('pPreview').classList.remove('d-none'); };
    reader.readAsDataURL(file);
  });

  $('productForm').addEventListener('submit', e => {
    e.preventDefault();
    const form = e.target;
    if (!form.checkValidity()) { form.classList.add('was-validated'); return; }
    const data = {
      name: $('pName').value.trim(), sku: $('pSku').value.trim(), description: $('pDesc').value.trim(),
      price: Number($('pPrice').value), qty: Number($('pQty').value), inStock: $('pStock').checked,
      category: $('pCategory').value, status: $('pStatus').value
    };
    if (existing) Object.assign(existing, data);
    else products.unshift({ id: Store.nextId(products), ...data });
    Store.set('products', products);
    U.flash(existing ? 'Product updated' : 'Product added');
    location.href = 'ecommerce-product-list.html';
  });
})();
</script>
</body>
</html>
