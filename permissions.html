<!doctype html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Permissions | Nexus Admin</title>
  <script>try{document.documentElement.dataset.bsTheme=localStorage.getItem('nexus-theme')||'light'}catch(e){}</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
  <link href="assets/css/app.css" rel="stylesheet">
</head>
<body data-title="Permissions List">
<main class="content">
  <p class="mb-4">Each category (Basic, Professional, and Business) includes the four predefined roles shown below.</p>
  <div class="card" id="permTable"></div>
</main>

<div class="modal fade" id="permModal" tabindex="-1" aria-labelledby="permModalTitle" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <form class="modal-content" id="permForm" novalidate>
      <div class="modal-header"><h5 class="modal-title" id="permModalTitle">Add New Permission</h5><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div>
      <div class="modal-body">
        <div class="mb-3"><label class="form-label" for="permName">Permission name</label><input class="form-control" id="permName" required><div class="invalid-feedback">Enter a unique permission name.</div></div>
        <label class="form-label d-block">Assigned to</label>
        <div id="permRoles" class="d-flex flex-wrap gap-3"></div>
      </div>
      <div class="modal-footer"><button type="button" class="btn btn-label-secondary" data-bs-dismiss="modal">Cancel</button><button type="submit" class="btn btn-primary">Save</button></div>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/table.js"></script>
<script src="assets/js/layout.js"></script>
<script>
(() => {
  let permissions = Store.get('permissions');
  const roleNames = Store.get('roles').map(r => r.name);
  const $ = id => document.getElementById(id);
  const modal = new bootstrap.Modal('#permModal');
  const form = $('permForm');
  let editingId = null;

  const table = DataTable({
    el: $('permTable'),
    getData: () => permissions,
    searchKeys: ['name', p => p.assignedTo.join(' ')],
    filters: [{ key: 'assigned', label: 'Assigned to', options: roleNames, match: (p, role) => p.assignedTo.includes(role) }],
    toolbar: '<button class="btn btn-primary" data-action="add"><i class="bx bx-plus me-1"></i>Add Permission</button>',
    columns: [
      { label: 'Name', key: 'name', render: p => `<span class="text-heading">${U.esc(p.name)}</span>` },
      { label: 'Assigned to', sortValue: p => p.assignedTo.join(), render: p => `<div class="d-flex flex-wrap gap-1">${p.assignedTo.map(U.badge).join('')}</div>` },
      { label: 'Created date', key: 'created', render: p => `<span class="text-nowrap">${U.date(p.created)}</span>` },
      { label: 'Actions', render: () => '<div class="d-flex gap-1"><button class="btn btn-icon btn-sm btn-text" data-action="edit" aria-label="Edit"><i class="bx bx-edit"></i></button><button class="btn btn-icon btn-sm btn-text" data-action="delete" aria-label="Delete"><i class="bx bx-trash"></i></button></div>' }
    ]
  });

  const save = () => { Store.set('permissions', permissions); table.refresh(); };

  function open(p) {
    editingId = p?.id ?? null;
    form.classList.remove('was-validated');
    $('permModalTitle').textContent = p ? 'Edit Permission' : 'Add New Permission';
    $('permName').value = p?.name || '';
    $('permRoles').innerHTML = roleNames.map((r, i) => `
      <div class="form-check"><input class="form-check-input" type="checkbox" id="pr${i}" value="${U.esc(r)}" ${p?.assignedTo.includes(r) ? 'checked' : ''}><label class="form-check-label" for="pr${i}">${U.esc(r)}</label></div>`).join('');
    modal.show();
  }

  $('permTable').addEventListener('click', async e => {
    const btn = e.target.closest('[data-action]');
    if (!btn) return;
    if (btn.dataset.action === 'add') { open(); return; }
    const p = permissions.find(x => x.id === Number(btn.closest('tr').dataset.id));
    if (btn.dataset.action === 'edit') open(p);
    if (btn.dataset.action === 'delete') {
      if (!(await U.confirm(`Permission "${p.name}" will be deleted.`))) return;
      permissions = permissions.filter(x => x !== p);
      save();
      U.toast('Permission deleted');
    }
  });

  form.addEventListener('submit', e => {
    e.preventDefault();
    const name = $('permName').value.trim();
    $('permName').setCustomValidity(!name || permissions.some(p => p.name.toLowerCase() === name.toLowerCase() && p.id !== editingId) ? 'invalid' : '');
    if (!form.checkValidity()) { form.classList.add('was-validated'); return; }
    const assignedTo = [...$('permRoles').querySelectorAll('input:checked')].map(i => i.value);
    if (editingId) Object.assign(permissions.find(p => p.id === editingId), { name, assignedTo });
    else permissions.unshift({ id: Store.nextId(permissions), name, assignedTo, created: U.today() });
    save();
    modal.hide();
    U.toast(editingId ? 'Permission updated' : 'Permission added');
  });
})();
</script>
</body>
</html>
