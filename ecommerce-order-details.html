<!doctype html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Order Details | Nexus Admin</title>
  <script>try{document.documentElement.dataset.bsTheme=localStorage.getItem('nexus-theme')||'light'}catch(e){}</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
  <link href="assets/css/app.css" rel="stylesheet">
</head>
<body>
<main class="content">
  <div class="page-actions">
    <a class="btn btn-label-secondary" id="prevOrder"><i class="bx bx-chevron-left"></i> Prev</a>
    <a class="btn btn-label-secondary" id="nextOrder">Next <i class="bx bx-chevron-right"></i></a>
    <button type="button" class="btn btn-label-danger" id="deleteOrder"><i class="bx bx-trash me-1"></i>Delete Order</button>
  </div>

  <div class="card mb-4"><div class="card-body d-flex flex-wrap justify-content-between align-items-center gap-3">
    <div>
      <h5 class="mb-1 d-flex align-items-center gap-2 flex-wrap">Order <span id="oId"></span> <span id="oBadges"></span></h5>
      <small class="text-muted" id="oDate"></small>
    </div>
    <div class="d-flex flex-wrap gap-2 align-items-center">
      <label class="form-label mb-0" for="oStatus">Status</label>
      <select class="form-select w-auto" id="oStatus"><option>Delivered</option><option>Out for delivery</option><option>Ready to pickup</option><option>Dispatched</option></select>
      <label class="form-label mb-0 ms-2" for="oPayment">Payment</label>
      <select class="form-select w-auto" id="oPayment"><option>Paid</option><option>Pending</option><option>Failed</option><option>Cancelled</option></select>
    </div>
  </div></div>

  <div class="row g-4">
    <div class="col-xl-8">
      <div class="card mb-4">
        <div class="card-header"><h5 class="card-title">Order details</h5></div>
        <div class="table-responsive">
          <table class="table align-middle"><thead><tr><th>Product</th><th>Price</th><th>Qty</th><th class="text-end">Total</th></tr></thead><tbody id="oItems"></tbody></table>
        </div>
        <div class="card-body d-flex justify-content-end">
          <dl class="row mb-0" style="min-width:16rem" id="oTotals"></dl>
        </div>
      </div>
      <div class="card">
        <div class="card-header"><h5 class="card-title">Shipping activity</h5></div>
        <div class="card-body"><ul class="timeline" id="oTimeline"></ul></div>
      </div>
    </div>

    <div class="col-xl-4">
      <div class="card mb-4"><div class="card-body" id="oCustomer"></div></div>
      <div class="card mb-4"><div class="card-body">
        <h6 class="mb-2">Shipping address</h6>
        <p class="mb-0" id="oShip"></p>
      </div></div>
      <div class="card"><div class="card-body">
        <h6 class="mb-2">Billing</h6>
        <p class="mb-1" id="oBill"></p>
        <p class="mb-0"><span class="fw-medium text-heading">Method:</span> <span id="oMethod"></span></p>
      </div></div>
    </div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/layout.js"></script>
<script>
(() => {
  let orders = Store.get('orders');
  const products = Store.get('products');
  const customers = Store.get('customers');
  const $ = id => document.getElementById(id);
  const idx = Math.max(0, orders.findIndex(o => o.id === Number(U.param('id'))));
  const order = orders[idx];
  if (!order) {
    document.querySelector('main.content').insertAdjacentHTML('beforeend', '<div class="alert alert-warning">No orders found. <a href="ecommerce-order-list.html">Back to orders</a></div>');
    return;
  }
  const customer = customers.find(c => c.id === order.customerId) || { name: 'Guest', email: '', phone: '', country: '' };
  const save = () => Store.set('orders', orders);

  // prev/next navigation
  const prev = orders[idx - 1];
  const next = orders[idx + 1];
  $('prevOrder').href = prev ? `?id=${prev.id}` : '#';
  $('prevOrder').classList.toggle('disabled', !prev);
  $('nextOrder').href = next ? `?id=${next.id}` : '#';
  $('nextOrder').classList.toggle('disabled', !next);

  function renderHeader() {
    $('oId').textContent = `#${order.id}`;
    $('oBadges').innerHTML = `${U.badge(order.payment)} ${U.badge(order.status)}`;
    $('oDate').textContent = `Placed on ${U.date(order.date)}`;
    $('oStatus').value = order.status;
    $('oPayment').value = order.payment;
  }

  // items
  const rows = order.items.map(it => ({ ...it, product: products.find(p => p.id === it.productId) })).filter(r => r.product);
  $('oItems').innerHTML = rows.map(r => `
    <tr>
      <td><div class="d-flex align-items-center gap-3"><span class="avatar avatar-rounded bg-label-${U.colorFor(r.product.category)}"><i class="bx bx-package fs-5"></i></span><div><a href="ecommerce-product-add.html?id=${r.product.id}" class="text-heading fw-medium">${U.esc(r.product.name)}</a><small class="d-block text-muted">${U.esc(r.product.category)}</small></div></div></td>
      <td>${U.money(r.product.price)}</td>
      <td>${r.qty}</td>
      <td class="text-end fw-medium text-heading">${U.money(r.product.price * r.qty)}</td>
    </tr>`).join('') || '<tr><td colspan="4" class="text-center text-muted py-4">Products in this order were deleted.</td></tr>';
  const subtotal = U.orderTotal(order, products);
  const shipping = subtotal > 500 ? 0 : 15;
  const tax = subtotal * 0.08;
  $('oTotals').innerHTML = [['Subtotal', subtotal], ['Shipping', shipping], ['Tax (8%)', tax]].map(([k, v]) =>
    `<dt class="col-6 fw-normal">${k}:</dt><dd class="col-6 text-end mb-1 text-heading">${U.money(v)}</dd>`).join('') +
    `<dt class="col-6 text-heading">Total:</dt><dd class="col-6 text-end mb-0 fw-semibold text-heading">${U.money(subtotal + shipping + tax)}</dd>`;

  // shipping timeline built from status
  const steps = [['Order placed', 'Your order has been placed successfully', 'primary'], ['Dispatched', 'Item has been picked up by the courier', 'info'], ['Ready to pickup', 'Package arrived at the local warehouse', 'warning'], ['Out for delivery', 'Courier is on the way', 'primary'], ['Delivered', 'Package delivered to the customer', 'success']];
  function renderTimeline() {
    const reached = { Dispatched: 1, 'Ready to pickup': 2, 'Out for delivery': 3, Delivered: 4 }[order.status] ?? 0;
    $('oTimeline').innerHTML = steps.map(([t, d, c], i) => {
      const day = new Date(`${order.date}T09:00:00`);
      day.setDate(day.getDate() + i);
      const done = i <= reached;
      return `<li class="timeline-item"><span class="timeline-point ${done ? c : ''}" style="${done ? '' : 'background:var(--border);box-shadow:none'}"></span>
        <div class="d-flex justify-content-between flex-wrap"><h6 class="mb-1 ${done ? '' : 'text-muted'}">${t}</h6><small class="text-muted">${done ? day.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' }) : 'Pending'}</small></div>
        <p class="mb-0 ${done ? '' : 'text-muted'}">${d}</p></li>`;
    }).join('');
  }

  // customer + addresses
  const orderCount = orders.filter(o => o.customerId === order.customerId).length;
  $('oCustomer').innerHTML = `
    <h6 class="mb-3">Customer details</h6>
    <div class="d-flex align-items-center gap-3 mb-3">${U.avatar(customer.name)}<div><span class="text-heading fw-medium d-block">${U.esc(customer.name)}</span><small class="text-muted">Customer ID: #${customer.id ?? '—'}</small></div></div>
    <div class="d-flex align-items-center gap-3 mb-3"><span class="stat-icon bg-label-success"><i class="bx bx-cart"></i></span><span class="text-heading">${orderCount} Order${orderCount === 1 ? '' : 's'}</span></div>
    <h6 class="mb-1">Contact info</h6>
    <p class="mb-1">Email: ${U.esc(customer.email)}</p>
    <p class="mb-0">Mobile: ${U.esc(customer.phone)}</p>`;
  const address = `${45 + (order.id % 50)} Roker Terrace<br>Latheronwheel<br>KW5 8NW, ${U.esc(customer.country)}`;
  $('oShip').innerHTML = address;
  $('oBill').innerHTML = address;
  $('oMethod').textContent = order.method;

  $('oStatus').addEventListener('change', e => { order.status = e.target.value; save(); renderHeader(); renderTimeline(); U.toast('Order status updated'); });
  $('oPayment').addEventListener('change', e => { order.payment = e.target.value; save(); renderHeader(); U.toast('Payment status updated'); });
  $('deleteOrder').addEventListener('click', async () => {
    if (!(await U.confirm(`Order #${order.id} will be permanently deleted.`))) return;
    orders = orders.filter(o => o !== order);
    save();
    U.flash('Order deleted');
    location.href = 'ecommerce-order-list.html';
  });

  renderHeader();
  renderTimeline();
})();
</script>
</body>
</html>
