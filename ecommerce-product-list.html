<!doctype html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Product List | Nexus Admin</title>
  <script>try{document.documentElement.dataset.bsTheme=localStorage.getItem('nexus-theme')||'light'}catch(e){}</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
  <link href="assets/css/app.css" rel="stylesheet">
</head>
<body>
<main class="content">
  <div class="row g-4 mb-4" id="stats"></div>
  <div class="card" id="productTable"></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/table.js"></script>
<script src="assets/js/layout.js"></script>
<script>
(() => {
  let products = Store.get('products');
  const categories = Store.get('categories');
  const save = () => { Store.set('products', products); renderStats(); };

  function renderStats() {
    const value = products.reduce((s, p) => s + p.price * p.qty, 0);
    const stats = [
      ['Total Products', products.length, 'bx-package', 'primary'],
      ['Published', products.filter(p => p.status === 'Published').length, 'bx-check-circle', 'success'],
      ['Out of Stock', products.filter(p => !p.inStock || p.qty === 0).length, 'bx-error', 'danger'],
      ['Inventory Value', U.money(value), 'bx-wallet', 'info']
    ];
    document.getElementById('stats').innerHTML = stats.map(([label, v, icon, color]) => `
      <div class="col-sm-6 col-xl-3"><div class="card h-100"><div class="card-body d-flex justify-content-between align-items-center">
        <div><p class="mb-1">${label}</p><h4 class="mb-0">${v}</h4></div>
        <span class="stat-icon stat-icon-lg bg-label-${color}"><i class="bx ${icon}"></i></span>
      </div></div></div>`).join('');
  }

  const table = DataTable({
    el: document.getElementById('productTable'),
    getData: () => products,
    searchKeys: ['name', 'sku', 'category'],
    filters: [
      { key: 'status', label: 'Status', options: ['Published', 'Scheduled', 'Inactive'] },
      { key: 'category', label: 'Category', options: categories.map(c => c.name) },
      { key: 'stock', label: 'Stock', options: ['In Stock', 'Out of Stock'], value: p => (p.inStock ? 'In Stock' : 'Out of Stock') }
    ],
    toolbar: '<a href="ecommerce-product-add.html" class="btn btn-primary"><i class="bx bx-plus me-1"></i>Add Product</a>',
    columns: [
      { label: 'Product', key: 'name', render: p => `<div class="d-flex align-items-center gap-3"><span class="avatar avatar-rounded bg-label-${U.colorFor(p.category)}"><i class="bx bx-package fs-5"></i></span><div><a href="ecommerce-product-add.html?id=${p.id}" class="text-heading fw-medium">${U.esc(p.name)}</a><small class="d-block text-muted text-truncate" style="max-width:14rem">${U.esc(p.description)}</small></div></div>` },
      { label: 'Category', key: 'category' },
      { label: 'Stock', sortValue: p => (p.inStock ? 1 : 0), render: p => `<div class="form-check form-switch mb-0"><input class="form-check-input" type="checkbox" data-action="stock" ${p.inStock ? 'checked' : ''} aria-label="In stock"></div>` },
      { label: 'SKU', key: 'sku' },
      { label: 'Price', key: 'price', render: p => U.money(p.price) },
      { label: 'Qty', key: 'qty' },
      { label: 'Status', key: 'status', render: p => U.badge(p.status) },
      { label: 'Actions', render: p => `<div class="d-flex gap-1"><a href="ecommerce-product-add.html?id=${p.id}" class="btn btn-icon btn-sm btn-text" aria-label="Edit"><i class="bx bx-edit"></i></a><button class="btn btn-icon btn-sm btn-text" data-action="delete" aria-label="Delete"><i class="bx bx-trash"></i></button></div>` }
    ]
  });

  document.getElementById('productTable').addEventListener('click', async e => {
    const btn = e.target.closest('[data-action="delete"]');
    if (!btn) return;
    const id = Number(btn.closest('tr').dataset.id);
    const product = products.find(p => p.id === id);
    if (!(await U.confirm(`"${product.name}" will be permanently deleted.`))) return;
    products = products.filter(p => p.id !== id);
    save();
    table.refresh();
    U.toast('Product deleted');
  });
  document.getElementById('productTable').addEventListener('change', e => {
    if (e.target.dataset.action !== 'stock') return;
    const product = products.find(p => p.id === Number(e.target.closest('tr').dataset.id));
    product.inStock = e.target.checked;
    save();
    U.toast(`${product.name} marked ${product.inStock ? 'in stock' : 'out of stock'}`, 'info');
  });

  renderStats();
})();
</script>
</body>
</html>
