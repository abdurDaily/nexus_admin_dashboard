<!doctype html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Order List | Nexus Admin</title>
  <script>try{document.documentElement.dataset.bsTheme=localStorage.getItem('nexus-theme')||'light'}catch(e){}</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
  <link href="assets/css/app.css" rel="stylesheet">
</head>
<body>
<main class="content">
  <div class="row g-4 mb-4" id="stats"></div>
  <div class="card" id="orderTable"></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/table.js"></script>
<script src="assets/js/layout.js"></script>
<script>
(() => {
  let orders = Store.get('orders');
  const products = Store.get('products');
  const customers = new Map(Store.get('customers').map(c => [c.id, c]));
  const total = o => U.orderTotal(o, products);
  const cust = o => customers.get(o.customerId) || { name: 'Guest', email: '' };
  const methodIcon = { PayPal: 'bxl-paypal', Visa: 'bxl-visa', Mastercard: 'bxl-mastercard' };

  function renderStats() {
    const stats = [
      ['Pending Payment', orders.filter(o => o.payment === 'Pending').length, 'bx-calendar', 'warning'],
      ['Completed', orders.filter(o => o.status === 'Delivered').length, 'bx-check-double', 'success'],
      ['Cancelled', orders.filter(o => o.payment === 'Cancelled').length, 'bx-x-circle', 'secondary'],
      ['Failed', orders.filter(o => o.payment === 'Failed').length, 'bx-error-alt', 'danger']
    ];
    document.getElementById('stats').innerHTML = stats.map(([label, v, icon, color]) => `
      <div class="col-sm-6 col-xl-3"><div class="card h-100"><div class="card-body d-flex justify-content-between align-items-center">
        <div><h4 class="mb-0">${v}</h4><p class="mb-0">${label}</p></div>
        <span class="stat-icon stat-icon-lg bg-label-${color}"><i class="bx ${icon}"></i></span>
      </div></div></div>`).join('');
  }

  const table = DataTable({
    el: document.getElementById('orderTable'),
    getData: () => orders,
    searchKeys: ['id', o => cust(o).name, o => cust(o).email, 'method'],
    filters: [
      { key: 'payment', label: 'Payment', options: ['Paid', 'Pending', 'Failed', 'Cancelled'] },
      { key: 'status', label: 'Status', options: ['Delivered', 'Out for delivery', 'Ready to pickup', 'Dispatched'] }
    ],
    columns: [
      { label: 'Order', key: 'id', render: o => `<a href="ecommerce-order-details.html?id=${o.id}" class="fw-medium">#${o.id}</a>` },
      { label: 'Date', key: 'date', render: o => `<span class="text-nowrap">${U.date(o.date)}</span>` },
      { label: 'Customer', sortValue: o => cust(o).name, render: o => `<div class="d-flex align-items-center gap-2">${U.avatar(cust(o).name, 'avatar-sm')}<div><span class="text-heading d-block text-nowrap">${U.esc(cust(o).name)}</span><small class="text-muted">${U.esc(cust(o).email)}</small></div></div>` },
      { label: 'Payment', key: 'payment', render: o => U.badge(o.payment) },
      { label: 'Status', key: 'status', render: o => U.badge(o.status) },
      { label: 'Method', key: 'method', render: o => `<span class="text-nowrap"><i class="bx ${methodIcon[o.method]} fs-4 align-middle me-1"></i>${o.method}</span>` },
      { label: 'Total', sortValue: total, render: o => `<span class="fw-medium text-heading">${U.money(total(o))}</span>` },
      { label: 'Actions', render: o => `<div class="d-flex gap-1"><a class="btn btn-icon btn-sm btn-text" href="ecommerce-order-details.html?id=${o.id}" aria-label="View"><i class="bx bx-show"></i></a><button class="btn btn-icon btn-sm btn-text" data-action="delete" aria-label="Delete"><i class="bx bx-trash"></i></button></div>` }
    ]
  });

  document.getElementById('orderTable').addEventListener('click', async e => {
    const btn = e.target.closest('[data-action="delete"]');
    if (!btn) return;
    const id = Number(btn.closest('tr').dataset.id);
    if (!(await U.confirm(`Order #${id} will be permanently deleted.`))) return;
    orders = orders.filter(o => o.id !== id);
    Store.set('orders', orders);
    table.refresh();
    renderStats();
    U.toast('Order deleted');
  });

  renderStats();
})();
</script>
</body>
</html>
