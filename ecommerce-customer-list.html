<!doctype html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Customers | Nexus Admin</title>
  <script>try{document.documentElement.dataset.bsTheme=localStorage.getItem('nexus-theme')||'light'}catch(e){}</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
  <link href="assets/css/app.css" rel="stylesheet">
</head>
<body>
<main class="content">
  <div class="card" id="customerTable"></div>
</main>

<div class="offcanvas offcanvas-end" tabindex="-1" id="customerPanel" aria-labelledby="customerPanelTitle">
  <div class="offcanvas-header border-bottom">
    <h5 class="offcanvas-title" id="customerPanelTitle">Add Customer</h5>
    <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
  </div>
  <div class="offcanvas-body">
    <form id="customerForm" novalidate>
      <div class="mb-3"><label class="form-label" for="cuName">Full name</label><input class="form-control" id="cuName" required><div class="invalid-feedback">Name is required.</div></div>
      <div class="mb-3"><label class="form-label" for="cuEmail">Email</label><input type="email" class="form-control" id="cuEmail" required><div class="invalid-feedback">Enter a valid, unused email.</div></div>
      <div class="mb-3"><label class="form-label" for="cuPhone">Mobile</label><input class="form-control" id="cuPhone" placeholder="+1 (555) 000-0000"></div>
      <div class="mb-4"><label class="form-label" for="cuCountry">Country</label><select class="form-select" id="cuCountry"></select></div>
      <button class="btn btn-primary me-2" type="submit">Save</button>
      <button class="btn btn-label-secondary" type="button" data-bs-dismiss="offcanvas">Cancel</button>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/table.js"></script>
<script src="assets/js/layout.js"></script>
<script>
(() => {
  let customers = Store.get('customers');
  const orders = Store.get('orders');
  const products = Store.get('products');
  const panel = new bootstrap.Offcanvas('#customerPanel');
  const form = document.getElementById('customerForm');
  const $ = id => document.getElementById(id);
  const countries = SEED.lookups.countries;
  $('cuCountry').innerHTML = countries.map(c => `<option>${c}</option>`).join('');

  const orderCount = c => orders.filter(o => o.customerId === c.id).length;
  const spent = c => orders.filter(o => o.customerId === c.id).reduce((s, o) => s + U.orderTotal(o, products), 0);

  const table = DataTable({
    el: $('customerTable'),
    getData: () => customers,
    searchKeys: ['name', 'email', 'country', 'id'],
    filters: [{ key: 'country', label: 'Country', options: countries }],
    toolbar: '<button class="btn btn-primary" data-action="add"><i class="bx bx-plus me-1"></i>Add Customer</button>',
    columns: [
      { label: 'Customer', key: 'name', render: c => `<div class="d-flex align-items-center gap-2">${U.avatar(c.name)}<div><span class="text-heading fw-medium d-block">${U.esc(c.name)}</span><small class="text-muted">${U.esc(c.email)}</small></div></div>` },
      { label: 'Customer ID', key: 'id', render: c => `#${c.id}` },
      { label: 'Country', key: 'country' },
      { label: 'Orders', sortValue: orderCount, render: orderCount },
      { label: 'Total Spent', sortValue: spent, render: c => `<span class="fw-medium text-heading">${U.money(spent(c))}</span>` },
      { label: 'Actions', render: () => '<button class="btn btn-icon btn-sm btn-text" data-action="delete" aria-label="Delete"><i class="bx bx-trash"></i></button>' }
    ]
  });

  $('customerTable').addEventListener('click', async e => {
    const btn = e.target.closest('[data-action]');
    if (!btn) return;
    if (btn.dataset.action === 'add') { form.reset(); form.classList.remove('was-validated'); panel.show(); return; }
    const c = customers.find(x => x.id === Number(btn.closest('tr').dataset.id));
    if (orderCount(c)) { U.toast(`${c.name} has orders and can't be deleted`, 'warning'); return; }
    if (!(await U.confirm(`${c.name} will be removed from your customers.`))) return;
    customers = customers.filter(x => x !== c);
    Store.set('customers', customers);
    table.refresh();
    U.toast('Customer deleted');
  });

  form.addEventListener('submit', e => {
    e.preventDefault();
    const email = $('cuEmail').value.trim().toLowerCase();
    $('cuEmail').setCustomValidity(customers.some(c => c.email.toLowerCase() === email) ? 'duplicate' : '');
    if (!form.checkValidity()) { form.classList.add('was-validated'); return; }
    customers.unshift({ id: Store.nextId(customers), name: $('cuName').value.trim(), email, phone: $('cuPhone').value.trim(), country: $('cuCountry').value, joined: U.today() });
    Store.set('customers', customers);
    table.refresh();
    panel.hide();
    U.toast('Customer added');
  });
})();
</script>
</body>
</html>
