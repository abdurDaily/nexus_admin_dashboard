<!doctype html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>eCommerce Dashboard | Nexus Admin</title>
  <script>try{document.documentElement.dataset.bsTheme=localStorage.getItem('nexus-theme')||'light'}catch(e){}</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
  <link href="assets/css/app.css" rel="stylesheet">
</head>
<body data-title="eCommerce Dashboard">
<main class="content">
  <div class="page-actions">
    <a href="ecommerce-product-add.html" class="btn btn-primary"><i class="bx bx-plus me-1"></i>Add Product</a>
  </div>

  <div class="row g-4">
    <div class="col-sm-6 col-xl-3"><div class="card h-100"><div class="card-body d-flex gap-3 align-items-center">
      <span class="stat-icon stat-icon-lg bg-label-primary"><i class="bx bx-dollar-circle"></i></span>
      <div><p class="mb-0">Total Sales</p><h4 class="mb-0" id="kSales">–</h4></div>
    </div></div></div>
    <div class="col-sm-6 col-xl-3"><div class="card h-100"><div class="card-body d-flex gap-3 align-items-center">
      <span class="stat-icon stat-icon-lg bg-label-success"><i class="bx bx-group"></i></span>
      <div><p class="mb-0">Customers</p><h4 class="mb-0" id="kCustomers">–</h4></div>
    </div></div></div>
    <div class="col-sm-6 col-xl-3"><div class="card h-100"><div class="card-body d-flex gap-3 align-items-center">
      <span class="stat-icon stat-icon-lg bg-label-info"><i class="bx bx-package"></i></span>
      <div><p class="mb-0">Products</p><h4 class="mb-0" id="kProducts">–</h4></div>
    </div></div></div>
    <div class="col-sm-6 col-xl-3"><div class="card h-100"><div class="card-body d-flex gap-3 align-items-center">
      <span class="stat-icon stat-icon-lg bg-label-warning"><i class="bx bx-receipt"></i></span>
      <div><p class="mb-0">Avg. Order</p><h4 class="mb-0" id="kAov">–</h4></div>
    </div></div></div>

    <div class="col-lg-8">
      <div class="card h-100">
        <div class="card-header d-flex justify-content-between align-items-center flex-wrap gap-2">
          <div><h5 class="card-title">Sales Overview</h5><small class="text-muted">Paid revenue per week</small></div>
          <div class="btn-group btn-group-sm" role="group" aria-label="Range">
            <input type="radio" class="btn-check" name="range" id="r8" value="8" checked><label class="btn btn-outline-primary" for="r8">8 weeks</label>
            <input type="radio" class="btn-check" name="range" id="r16" value="16"><label class="btn btn-outline-primary" for="r16">16 weeks</label>
            <input type="radio" class="btn-check" name="range" id="r26" value="26"><label class="btn btn-outline-primary" for="r26">26 weeks</label>
          </div>
        </div>
        <div class="card-body pt-0"><div id="salesChart"></div></div>
      </div>
    </div>
    <div class="col-lg-4">
      <div class="card h-100">
        <div class="card-header"><h5 class="card-title">Payment Status</h5><small class="text-muted">Share of all orders</small></div>
        <div class="card-body"><div id="paymentChart"></div></div>
      </div>
    </div>

    <div class="col-xl-5">
      <div class="card h-100">
        <div class="card-header d-flex justify-content-between align-items-center"><h5 class="card-title">Top Products</h5><a href="ecommerce-product-list.html" class="btn btn-sm btn-label-primary">View all</a></div>
        <div class="table-responsive">
          <table class="table align-middle"><thead><tr><th>Product</th><th>Sold</th><th class="text-end">Revenue</th></tr></thead><tbody id="topProducts"></tbody></table>
        </div>
      </div>
    </div>
    <div class="col-md-6 col-xl-4">
      <div class="card h-100">
        <div class="card-header d-flex justify-content-between align-items-center"><h5 class="card-title">Top Customers</h5><a href="ecommerce-customer-list.html" class="btn btn-sm btn-label-primary">View all</a></div>
        <div class="card-body"><ul class="list-unstyled mb-0" id="topCustomers"></ul></div>
      </div>
    </div>
    <div class="col-md-6 col-xl-3">
      <div class="card h-100">
        <div class="card-header"><h5 class="card-title">Sales by Country</h5></div>
        <div class="card-body"><ul class="list-unstyled mb-0" id="countries"></ul></div>
      </div>
    </div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.54.0/dist/apexcharts.min.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/layout.js"></script>
<script>
(() => {
  const products = Store.get('products');
  const orders = Store.get('orders');
  const customers = Store.get('customers');
  const total = o => U.orderTotal(o, products);
  const paid = orders.filter(o => o.payment === 'Paid');
  const age = d => (Date.now() - new Date(`${d}T00:00:00`)) / 864e5;

  document.getElementById('kSales').textContent = U.money(paid.reduce((s, o) => s + total(o), 0));
  document.getElementById('kCustomers').textContent = customers.length;
  document.getElementById('kProducts').textContent = products.length;
  document.getElementById('kAov').textContent = U.money(orders.length ? orders.reduce((s, o) => s + total(o), 0) / orders.length : 0);

  // Weekly sales with range switch
  let weeksShown = 8;
  const weekly = n => [...Array(n)].map((_, i) => {
    const from = (n - 1 - i) * 7;
    return Math.round(paid.filter(o => age(o.date) >= from && age(o.date) < from + 7).reduce((s, o) => s + total(o), 0));
  });
  const salesChart = U.chart(document.getElementById('salesChart'), c => ({
      chart: { type: 'area', height: 320 },
      series: [{ name: 'Revenue', data: weekly(weeksShown) }],
      colors: [c.primary],
      dataLabels: { enabled: false },
      stroke: { width: 3, curve: 'smooth' },
      fill: { type: 'gradient', gradient: { shadeIntensity: .6, opacityFrom: .5, opacityTo: .05, stops: [0, 95, 100] } },
      xaxis: { categories: [...Array(weeksShown)].map((_, i) => `W${i + 1}`), axisBorder: { show: false }, axisTicks: { show: false } },
      yaxis: { labels: { formatter: v => `$${(v / 1000).toFixed(1)}k` } },
      tooltip: { y: { formatter: v => U.money(v) } }
  }));
  document.querySelectorAll('input[name="range"]').forEach(r => r.addEventListener('change', () => { weeksShown = Number(r.value); salesChart?.render(); }));

  // Payment status donut
  const pay = ['Paid', 'Pending', 'Failed', 'Cancelled'];
  U.chart(document.getElementById('paymentChart'), c => ({
    chart: { type: 'donut', height: 320 },
    series: pay.map(p => orders.filter(o => o.payment === p).length),
    labels: pay,
    colors: [c.success, c.warning, c.danger, c.secondary],
    stroke: { width: 4, colors: [c.surface] },
    legend: { position: 'bottom' },
    dataLabels: { enabled: false },
    plotOptions: { pie: { donut: { size: '70%', labels: { show: true, value: { color: c.heading, fontWeight: 600 }, total: { show: true, label: 'Orders', color: c.muted } } } } }
  }));

  // Top products
  const sold = new Map();
  orders.forEach(o => o.items.forEach(it => sold.set(it.productId, (sold.get(it.productId) || 0) + it.qty)));
  const top = products.map(p => ({ ...p, sold: sold.get(p.id) || 0, revenue: (sold.get(p.id) || 0) * p.price }))
    .sort((a, b) => b.revenue - a.revenue).slice(0, 6);
  document.getElementById('topProducts').innerHTML = top.map(p => `
    <tr>
      <td><div class="d-flex align-items-center gap-2"><span class="avatar avatar-sm avatar-rounded bg-label-${U.colorFor(p.category)}"><i class="bx bx-package"></i></span><div><a href="ecommerce-product-add.html?id=${p.id}" class="text-heading fw-medium">${U.esc(p.name)}</a><small class="d-block text-muted">${U.esc(p.category)}</small></div></div></td>
      <td>${p.sold}</td>
      <td class="text-end fw-medium text-heading">${U.money(p.revenue)}</td>
    </tr>`).join('');

  // Top customers
  const spent = new Map();
  orders.forEach(o => spent.set(o.customerId, (spent.get(o.customerId) || 0) + total(o)));
  document.getElementById('topCustomers').innerHTML = customers
    .map(c => ({ ...c, spent: spent.get(c.id) || 0 }))
    .sort((a, b) => b.spent - a.spent).slice(0, 6)
    .map(c => `<li class="d-flex align-items-center gap-3 mb-3">
      ${U.avatar(c.name)}
      <div class="flex-grow-1"><span class="text-heading d-block">${U.esc(c.name)}</span><small class="text-muted">${U.esc(c.email)}</small></div>
      <span class="fw-medium text-heading">${U.money(c.spent)}</span>
    </li>`).join('');

  // Sales by country
  const byCountry = new Map();
  orders.forEach(o => {
    const country = customers.find(c => c.id === o.customerId)?.country || 'Unknown';
    byCountry.set(country, (byCountry.get(country) || 0) + total(o));
  });
  const totalAll = [...byCountry.values()].reduce((a, b) => a + b, 0) || 1;
  document.getElementById('countries').innerHTML = [...byCountry.entries()].sort((a, b) => b[1] - a[1]).slice(0, 6).map(([name, v]) => `
    <li class="mb-3">
      <div class="d-flex justify-content-between mb-1"><span class="text-heading">${U.esc(name)}</span><span class="fw-medium">${U.money(v)}</span></div>
      <div class="progress" style="--bs-progress-height:.375rem"><div class="progress-bar" style="width:${(v / totalAll * 100).toFixed(1)}%"></div></div>
    </li>`).join('');
})();
</script>
</body>
</html>
