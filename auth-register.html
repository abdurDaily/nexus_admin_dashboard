<!doctype html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Register | Nexus Admin</title>
  <script>try{document.documentElement.dataset.bsTheme=localStorage.getItem('nexus-theme')||'light'}catch(e){}</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
  <link href="assets/css/app.css" rel="stylesheet">
</head>
<body>
  <main class="auth-wrapper">
    <div class="card auth-card"><div class="card-body p-4 p-sm-5">
      <a href="index.html" class="auth-brand"><i class="bx bxs-layer fs-1 text-primary"></i><span class="fs-3 fw-bold">Nexus</span></a>
      <h4 class="mb-1">Adventure starts here 🚀</h4>
      <p class="mb-4">Make your app management easy and fun!</p>
      <form id="registerForm" novalidate>
        <div class="mb-3"><label class="form-label" for="regUsername">Username</label><input class="form-control" id="regUsername" placeholder="Enter your username" autocomplete="username" required minlength="3"><div class="invalid-feedback">At least 3 characters.</div></div>
        <div class="mb-3"><label class="form-label" for="regEmail">Email</label><input type="email" class="form-control" id="regEmail" placeholder="Enter your email" autocomplete="email" required><div class="invalid-feedback">Enter a valid email.</div></div>
        <div class="mb-3"><label class="form-label" for="regPassword">Password</label><input type="password" class="form-control" id="regPassword" placeholder="••••••••" autocomplete="new-password" required minlength="8"><div class="invalid-feedback">At least 8 characters.</div></div>
        <div class="form-check mb-4">
          <input class="form-check-input" type="checkbox" id="terms" required>
          <label class="form-check-label" for="terms">I agree to the <a href="pages-faq.html">privacy policy &amp; terms</a></label>
          <div class="invalid-feedback">You must accept the terms.</div>
        </div>
        <button class="btn btn-primary w-100" type="submit">Sign up</button>
      </form>
      <p class="text-center mt-4 mb-0">Already have an account? <a href="auth-login.html">Sign in instead</a></p>
    </div></div>
  </main>
<script>
(() => {
  const form = document.getElementById('registerForm');
  // Demo only: no backend — a valid form takes you to the dashboard.
  form.addEventListener('submit', e => {
    e.preventDefault();
    if (!form.checkValidity()) { form.classList.add('was-validated'); return; }
    try { sessionStorage.setItem('nexus-flash', JSON.stringify({ message: 'Account created — welcome aboard!', type: 'success' })); } catch { /* ignore */ }
    location.href = 'index.html';
  });
})();
</script>
</body>
</html>
